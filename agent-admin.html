<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Partner Desk Admin – Himachal Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A1A31;--surface:#102647;--surface2:#15305A;--line:#25457A;--text:#F4EFE3;--muted:#A3B3CB;--gold:#E4B450;--gold-ink:#1A1405;--keep:#5FCB8E;--danger:#FF9A90;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--body:"Hanken Grotesk","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);line-height:1.5}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15}
p{margin:0}a{color:var(--gold)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:4px}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}
.top{border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:60px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:1.1rem}
.brand span{color:var(--gold)}
.top .right{margin-left:auto;display:flex;gap:10px;align-items:center;color:var(--muted);font-size:.9rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-size:.9rem;color:var(--muted)}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
input[type=checkbox]{width:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--gold);color:var(--gold-ink);border:0;border-radius:9px;padding:10px 16px;font-weight:600;cursor:pointer;text-decoration:none}
.btn.line{background:none;color:var(--text);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:.9rem}
.btn:disabled{opacity:.6;cursor:wait}
.msg{margin-top:10px;font-size:.92rem;min-height:1.2em}.msg.err{color:var(--danger)}.msg.ok{color:var(--keep)}
main{padding:32px 0 60px}
.login{max-width:420px;margin:40px auto}
.tabs{display:flex;gap:6px;margin:22px 0 14px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:600}
.tabs button[aria-selected=true]{color:var(--text);border-color:var(--gold)}
.item{border-bottom:1px solid var(--line);padding:14px 4px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.item small{display:block;color:var(--muted)}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel{grid-column:1/-1;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;grid-template-columns:1fr 1.4fr auto;gap:12px;align-items:end}
.panel .field{margin:0}
.result{border-color:var(--keep);margin-top:18px}
.result code{background:var(--bg);padding:2px 8px;border-radius:6px;font-size:1.05rem}
.empty{padding:32px 4px;color:var(--muted)}
.chip{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted)}
.sw{display:flex;align-items:center;gap:6px;font-size:.9rem;color:var(--muted)}
@media(max-width:700px){.item{grid-template-columns:1fr}.panel{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <span class="brand">Himachal Explorer <span>Partner Desk Admin</span></span>
  <div class="right"><span id="who"></span><button class="btn line sm" id="outBtn" type="button" hidden>Sign out</button></div>
</div></header>

<main><div class="wrap">

<div class="card login" id="setupMsg" hidden>
  <h2>Setup needed</h2>
  <p style="color:var(--muted);margin-top:8px">Open <b>partner-config.js</b> and paste your Firebase web app keys. Then reload this page.</p>
</div>

<div class="card login" id="loginView">
  <h2>Admin login</h2>
  <p style="color:var(--muted);margin:8px 0 18px">Use the email and password of your own Firebase admin account.</p>
  <form id="loginForm" novalidate>
    <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div>
    <div class="field"><label for="pass">Password</label><input id="pass" type="password" autocomplete="current-password" required></div>
    <button class="btn" type="submit" id="loginBtn">Log in</button>
    <p class="msg" id="loginMsg" role="alert"></p>
  </form>
</div>

<div id="appView" hidden>
  <h1 style="font-size:1.8rem">Partners</h1>
  <div id="result" class="card result" hidden></div>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tabApps" aria-selected="true">New applications <span class="chip" id="cApps">0</span></button>
    <button type="button" role="tab" id="tabPartners" aria-selected="false">Approved partners <span class="chip" id="cPartners">0</span></button>
  </div>
  <p class="msg" id="listMsg" role="alert"></p>
  <div id="apps"></div>
  <div id="partners" hidden></div>
</div>

</div></main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" onerror="void 0"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" onerror="void 0"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js" onerror="void 0"></script>
<script src="partner-config.js"></script>
<script>
(function () {
'use strict';
const CONFIG = window.PARTNER_CONFIG;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

if (!CONFIG || !window.firebase || CONFIG.firebase.apiKey.indexOf('YOUR_') === 0) {
  $('#loginView').hidden = true; $('#setupMsg').hidden = false; return;
}
firebase.initializeApp(CONFIG.firebase);
const auth = firebase.auth(), db = firebase.firestore();
const C = CONFIG.collections;
const phoneToEmail = p => p + '@agents.himachalexplorer.in';   // must match agent-partner.html
const say = (el, t, k) => { el.textContent = t; el.className = 'msg ' + (k || ''); };
function genPassword() {
  const a = new Uint32Array(1); crypto.getRandomValues(a);
  return 'HP' + String(a[0] % 900000 + 100000);
}
let apps = [], partners = [];

/* ---------- login ---------- */
$('#loginForm').addEventListener('submit', async ev => {
  ev.preventDefault();
  const msg = $('#loginMsg'), btn = $('#loginBtn');
  btn.disabled = true; say(msg, 'Logging in…');
  try { await auth.signInWithEmailAndPassword($('#email').value.trim(), $('#pass').value); say(msg, ''); }
  catch (e) { say(msg, 'Email or password is not correct.', 'err'); }
  btn.disabled = false;
});
$('#outBtn').addEventListener('click', () => auth.signOut());

auth.onAuthStateChanged(async user => {
  if (!user) { $('#loginView').hidden = false; $('#appView').hidden = true; $('#outBtn').hidden = true; $('#who').textContent = ''; return; }
  $('#outBtn').hidden = false; $('#who').textContent = user.email || '';
  try {
    const a = await db.collection('admins').doc(user.uid).get();
    if (!a.exists) {
      $('#loginView').hidden = false; $('#appView').hidden = true;
      say($('#loginMsg'), 'This account is not an admin. Add its UID to the "admins" collection in Firestore.', 'err');
      return;
    }
    $('#loginView').hidden = true; $('#appView').hidden = false;
    await loadAll();
  } catch (e) { say($('#loginMsg'), 'Could not check admin access. Check your Firestore rules.', 'err'); }
});

/* ---------- data ---------- */
async function loadAll() {
  say($('#listMsg'), 'Loading…');
  try {
    const [a, p] = await Promise.all([
      db.collection(C.applications).where('status', '==', 'new').get(),
      db.collection(C.agents).get()
    ]);
    apps = a.docs.map(d => Object.assign({ id: d.id }, d.data()))
      .sort((x, y) => ((y.createdAt && y.createdAt.seconds) || 0) - ((x.createdAt && x.createdAt.seconds) || 0));
    partners = p.docs.map(d => Object.assign({ id: d.id }, d.data()))
      .sort((x, y) => String(x.name).localeCompare(String(y.name)));
    say($('#listMsg'), '');
    render();
  } catch (e) { say($('#listMsg'), 'Could not load data. Check your Firestore rules.', 'err'); }
}

const levelOptions = sel => Object.keys(CONFIG.levels).map(k =>
  '<option value="' + k + '"' + (k === sel ? ' selected' : '') + '>' + esc(CONFIG.levels[k].label) + ' · ' + CONFIG.levels[k].pct + '%</option>').join('');
const when = a => (a.createdAt && a.createdAt.toDate) ? a.createdAt.toDate().toLocaleDateString('en-IN') : '';

function render() {
  $('#cApps').textContent = apps.length; $('#cPartners').textContent = partners.length;
  $('#apps').innerHTML = apps.length ? apps.map(a =>
    '<article class="item" data-id="' + esc(a.id) + '">' +
      '<div><strong>' + esc(a.name) + '</strong><small>' + esc(a.phone) + ' · ' + esc(a.city) + (when(a) ? ' · ' + when(a) : '') + '</small></div>' +
      '<div class="acts"><button class="btn sm" type="button" data-act="open">Approve</button><button class="btn line sm" type="button" data-act="dismiss">Dismiss</button></div>' +
      '<div class="panel" hidden>' +
        '<div class="field"><label>Level</label><select data-f="level">' + levelOptions('starter') + '</select></div>' +
        '<div class="field"><label>Password for this agent (6+ characters)</label><input data-f="pw" value="' + genPassword() + '"></div>' +
        '<button class="btn" type="button" data-act="create">Create login</button>' +
      '</div></article>').join('') : '<div class="empty">No new applications.</div>';

  $('#partners').innerHTML = partners.length ? partners.map(p =>
    '<article class="item" data-id="' + esc(p.id) + '">' +
      '<div><strong>' + esc(p.name) + '</strong><small>' + esc(p.phone) + ' · ' + esc(p.city) + '</small></div>' +
      '<div class="acts"><select data-f="lvl" aria-label="Level for ' + esc(p.name) + '">' + levelOptions(p.level) + '</select>' +
      '<label class="sw"><input type="checkbox" data-f="active"' + (p.approved ? ' checked' : '') + '> Active</label>' +
      '<button class="btn line sm" type="button" data-act="reissue">New login</button></div></article>').join('') : '<div class="empty">No partners yet.</div>';
}

/* ---------- create a login without Cloud Functions ----------
   A second, temporary Firebase app signs the new user up, so your admin session stays intact. */
async function createLogin(phone, password) {
  const sec = firebase.initializeApp(CONFIG.firebase, 'sec' + Date.now());
  try {
    const cred = await sec.auth().createUserWithEmailAndPassword(phoneToEmail(phone), password);
    await sec.auth().signOut();
    return cred.user.uid;
  } finally { await sec.delete(); }
}

function showResult(name, phone, password) {
  const login = CONFIG.siteUrl + '/agent-partner.html';
  const text = 'Hi ' + name + ', your Himachal Explorer Partner Desk account is ready.\nLogin page: ' + login +
    '\nMobile number: ' + phone + '\nPassword: ' + password + '\nPlease change your password after you log in.';
  const box = $('#result');
  box.innerHTML = '<h3>Login created for ' + esc(name) + '</h3>' +
    '<p style="margin:8px 0">Login ID <code>' + esc(phone) + '</code> &nbsp; Password <code>' + esc(password) + '</code></p>' +
    '<p style="color:var(--muted)">This password is shown only now. Send it to the agent.</p>' +
    '<div class="acts" style="margin-top:12px"><a class="btn sm" target="_blank" rel="noopener" href="https://wa.me/91' + esc(phone) + '?text=' + encodeURIComponent(text) + '">Send on WhatsApp</a>' +
    '<button class="btn line sm" type="button" id="copyRes">Copy message</button><button class="btn line sm" type="button" id="closeRes">Close</button></div>';
  box.hidden = false;
  $('#copyRes').onclick = async () => { try { await navigator.clipboard.writeText(text); say($('#listMsg'), 'Message copied.', 'ok'); } catch (e) { window.prompt('Copy:', text); } };
  $('#closeRes').onclick = () => { box.hidden = true; box.innerHTML = ''; };
  window.scrollTo(0, 0);
}

function fail(e) {
  const c = (e && e.code) || '';
  if (c.indexOf('email-already-in-use') > -1) return 'A login already exists for this number. Use the Approved partners tab, or delete the old login in Firebase console first.';
  if (c.indexOf('weak-password') > -1) return 'Password must be 6 or more characters.';
  if (c.indexOf('permission-denied') > -1) return 'Permission denied. Check your Firestore rules and admins document.';
  return 'Something went wrong. Please try again.';
}

/* ---------- actions ---------- */
$('#apps').addEventListener('click', async ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const row = b.closest('.item'), a = apps.find(x => x.id === row.dataset.id), msg = $('#listMsg');
  if (b.dataset.act === 'open') { row.querySelector('.panel').hidden = !row.querySelector('.panel').hidden; return; }
  if (b.dataset.act === 'dismiss') {
    if (!window.confirm('Dismiss the application from ' + a.name + '?')) return;
    try { await db.collection(C.applications).doc(a.id).update({ status: 'dismissed' }); await loadAll(); } catch (e) { say(msg, fail(e), 'err'); }
    return;
  }
  if (b.dataset.act === 'create') {
    const pw = row.querySelector('[data-f=pw]').value.trim(), level = row.querySelector('[data-f=level]').value;
    if (pw.length < 6) return say(msg, 'Password must be 6 or more characters.', 'err');
    b.disabled = true; say(msg, 'Creating login…');
    try {
      const uid = await createLogin(a.phone, pw);
      const batch = db.batch();
      batch.set(db.collection(C.agents).doc(uid), { name: a.name, phone: a.phone, city: a.city, approved: true, level: level, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
      batch.update(db.collection(C.applications).doc(a.id), { status: 'approved', agentUid: uid });
      await batch.commit();
      say(msg, '');
      await loadAll();
      showResult(a.name, a.phone, pw);
    } catch (e) { say(msg, fail(e), 'err'); b.disabled = false; }
  }
});

$('#partners').addEventListener('change', async ev => {
  const f = ev.target.dataset.f; if (!f) return;
  const id = ev.target.closest('.item').dataset.id, msg = $('#listMsg');
  try {
    if (f === 'lvl') await db.collection(C.agents).doc(id).update({ level: ev.target.value });
    if (f === 'active') await db.collection(C.agents).doc(id).update({ approved: ev.target.checked });
    say(msg, 'Saved.', 'ok');
  } catch (e) { say(msg, fail(e), 'err'); }
});

$('#partners').addEventListener('click', async ev => {
  const b = ev.target.closest('[data-act=reissue]'); if (!b) return;
  const id = b.closest('.item').dataset.id, p = partners.find(x => x.id === id), msg = $('#listMsg');
  if (!window.confirm('Forgot password for ' + p.name + '?\n\nFirst delete the old login for ' + p.phone + ' in Firebase console > Authentication. Then continue to create a new one.')) return;
  const pw = window.prompt('New password for ' + p.name + ' (6+ characters):', genPassword());
  if (!pw) return;
  if (pw.length < 6) return say(msg, 'Password must be 6 or more characters.', 'err');
  say(msg, 'Creating new login…');
  try {
    const uid = await createLogin(p.phone, pw);
    const data = Object.assign({}, p); delete data.id;
    const batch = db.batch();
    batch.set(db.collection(C.agents).doc(uid), data);
    batch.delete(db.collection(C.agents).doc(id));
    await batch.commit();
    say(msg, '');
    await loadAll();
    showResult(p.name, p.phone, pw);
  } catch (e) { say(msg, fail(e), 'err'); }
});

/* ---------- tabs ---------- */
function tab(which) {
  const a = which === 'apps';
  $('#apps').hidden = !a; $('#partners').hidden = a;
  $('#tabApps').setAttribute('aria-selected', String(a)); $('#tabPartners').setAttribute('aria-selected', String(!a));
}
$('#tabApps').addEventListener('click', () => tab('apps'));
$('#tabPartners').addEventListener('click', () => tab('partners'));

})();
</script>
</body>
</html>
