# Adds / updates / removes the Himachal Explorer chatbot on every HTML page.
# Runs on GitHub's servers - nothing to install, works from a phone browser.
# Use: Actions tab -> "Add chatbot to all pages" -> Run workflow.
name: Add chatbot to all pages

on:
  workflow_dispatch:
    inputs:
      action:
        description: "add (also updates an existing block) or remove"
        type: choice
        options: [add, remove]
        default: add
      whatsapp:
        description: "WhatsApp number, digits only with country code (e.g. 919876543210)"
        type: string
        required: false
      offset_bottom:
        description: "Optional: lift the button up by N pixels if another button is in the corner (e.g. 80)"
        type: string
        required: false
      include_sukoon:
        description: "Also add to the /sukoon-homestay/ pages"
        type: boolean
        default: false
      dry_run:
        description: "Preview only: list the pages, change nothing"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  chatbot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Insert or remove the chatbot block
        env:
          ACTION: ${{ inputs.action }}
          WA: ${{ inputs.whatsapp }}
          OFFSET: ${{ inputs.offset_bottom }}
          INCLUDE_SUKOON: ${{ inputs.include_sukoon }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          if [ "$ACTION" = "add" ]; then
            [ -f hx-chatbot.js ] || { echo "::error::hx-chatbot.js is not in the repo root. Upload it next to index.html first."; exit 1; }
            if [ -n "$WA" ] && ! [[ "$WA" =~ ^[0-9]{10,15}$ ]]; then
              echo "::error::WhatsApp number must be digits only with country code, e.g. 919876543210"; exit 1
            fi
            if [ -n "$OFFSET" ] && ! [[ "$OFFSET" =~ ^[0-9]{1,3}$ ]]; then
              echo "::error::offset_bottom must be a number like 80"; exit 1
            fi
            CFGJS=""
            [ -n "$WA" ] && CFGJS="whatsapp:\"$WA\""
            if [ -n "$OFFSET" ]; then [ -n "$CFGJS" ] && CFGJS="$CFGJS,"; CFGJS="${CFGJS}offsetBottom:$OFFSET"; fi
            VER=$(date +%Y%m%d%H%M)
            BLOCK="<!-- hx-chatbot:start -->"$'\n'
            [ -n "$CFGJS" ] && BLOCK="${BLOCK}<script>window.HX_CONFIG={${CFGJS}};</script>"$'\n'
            BLOCK="${BLOCK}<script src=\"/hx-chatbot.js?v=${VER}\" defer></script>"$'\n'"<!-- hx-chatbot:end -->"$'\n'
            export BLOCK
          fi

          PRUNE=(-path ./.git -o -path ./.github -o -path ./node_modules -o -path ./_chatbot-setup -o -path ./admin -o -path ./legacy -o -path ./docs -o -path ./android -o -path ./app -o -path ./build -o -path ./dist -o -path ./vendor)
          [ "$INCLUDE_SUKOON" = "true" ] || PRUNE+=(-o -path ./sukoon-homestay)

          added=0; updated=0; removed=0; skipped=0
          : > /tmp/report.txt
          while IFS= read -r -d '' f; do
            rel="${f#./}"
            if [ "$ACTION" = "remove" ]; then
              if grep -q 'hx-chatbot:start' "$f"; then
                perl -0777 -i -pe 's/<!-- hx-chatbot:start -->.*?<!-- hx-chatbot:end -->\r?\n?//s' "$f"
                removed=$((removed+1)); echo "removed  $rel" >> /tmp/report.txt
              fi
              continue
            fi
            if grep -q 'hx-chatbot:start' "$f"; then
              perl -0777 -i -pe 's/<!-- hx-chatbot:start -->.*?<!-- hx-chatbot:end -->\r?\n?/$ENV{BLOCK}/s' "$f"
              updated=$((updated+1)); echo "updated  $rel" >> /tmp/report.txt
            elif grep -qiE 'http-equiv[[:space:]]*=[[:space:]]*.?refresh' "$f"; then
              skipped=$((skipped+1)); echo "skipped  $rel (redirect page)" >> /tmp/report.txt
            elif ! grep -qi '</body' "$f"; then
              skipped=$((skipped+1)); echo "skipped  $rel (no </body>)" >> /tmp/report.txt
            else
              perl -0777 -i -pe 's/^(.*)(<\/body\s*>)/$1$ENV{BLOCK}$2/is' "$f"
              added=$((added+1)); echo "added    $rel" >> /tmp/report.txt
            fi
          done < <(find . \( "${PRUNE[@]}" \) -prune -o -type f \( -iname '*.html' -o -iname '*.htm' \) -print0 | sort -z)

          sort /tmp/report.txt
          SUMMARY="action=$ACTION  added=$added  updated=$updated  removed=$removed  skipped=$skipped"
          echo "$SUMMARY"
          { echo "### Chatbot workflow"; echo "$SUMMARY"; echo; echo '```'; sort /tmp/report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN: nothing was committed. Run again with dry_run unticked to apply."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Chatbot: $ACTION on all pages"
            git push
          fi
