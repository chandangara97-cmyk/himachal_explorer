<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="pine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f8f6f"/>
      <stop offset="100%" stop-color="#14301f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#b07d3a"/>
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="248" fill="#f8f5ef" stroke="url(#gold)" stroke-width="10"/>
  <!-- mountain pass -->
  <path d="M56 340 L180 160 L235 235 L300 130 L456 340 Z" fill="#14301f"/>
  <path d="M180 160 L235 235 L206 235 Z" fill="#f8f5ef" opacity="0.85"/>
  <path d="M300 130 L346 200 L254 200 Z" fill="#f8f5ef" opacity="0.85"/>
  <!-- pine tree -->
  <g transform="translate(256,300)">
    <polygon points="0,-95 42,-15 -42,-15" fill="url(#pine)"/>
    <polygon points="0,-60 34,10 -34,10" fill="url(#pine)"/>
    <polygon points="0,-25 46,55 -46,55" fill="url(#pine)"/>
    <rect x="-8" y="55" width="16" height="26" fill="#5a4a36"/>
  </g>
  <!-- gold pass line -->
  <path d="M40 370 Q256 300 472 370" stroke="url(#gold)" stroke-width="8" fill="none" stroke-linecap="round"/>
</svg>
